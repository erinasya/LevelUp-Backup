
<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#CBE7FF">

    <title>Masuk | LevelUp</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="login-page">
    <div class="login-frame">
        <section class="login-visual">
            <a class="brand" href="index.html">
                <img src="assets/images/logo/levelup-logo-full.png" alt="LevelUp">
            </a>

            <div>
                <span class="eyebrow">YOUR PERSONAL GROWTH SPACE</span>
                <h1>
                    Grow with<br>
                    purpose.<br>
                    <em>Progress with proof.</em>
                </h1>
                <p>
                   Every small step you take today helps shape the person you're becoming.
                </p>
            </div>

        </section>

        <section class="login-side">
            <form class="login-form" id="login-form" novalidate>
                <div class="brand">
                   <div class="eyebrow">WELCOME TO LEVELUP</div>
                    <h2>Your journey starts here.</h2>
                </div>

                <div
                    id="login-message"
                    class="notice error hidden"
                    role="alert"
                ></div>

                <div class="field">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@email.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="between" style="margin:8px 0 20px">
                    <label class="checkbox-row">
                        <input type="checkbox" id="show-password">
                       Show password
                    </label>
                </div>

                <button
                    class="btn btn-dark btn-block"
                    type="submit"
                    id="login-submit"
                >
                    Sign in to LevelUp <span>↗</span>
                </button>

            </form>
        </section>
    </div>

    <script defer src="js/storage.js"></script>
    <script defer src="js/data.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/login.js"></script>
</body>
</html>
